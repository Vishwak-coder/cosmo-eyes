name: Build Cosmo Eyes firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls http://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266
          arduino-cli lib install "Adafruit SSD1306" "Adafruit GFX Library" "FluxGarage RoboEyes"

      # NodeMCU = esp8266:esp8266:nodemcuv2
      # Wemos D1 Mini = esp8266:esp8266:d1_mini  (change the line below if you use it)
      - name: Compile
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 CosmoEyes_Spidey --output-dir build

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/*.ino.bin
